services:
  shoppinglist:
    container_name: korb
    image: ${SHOPPING_IMAGE:?Set SHOPPING_IMAGE to the published application image}
    restart: unless-stopped
    environment:
      SHOPPING_DATA_DIR: /data
      AMAZON_DOMAIN: ${AMAZON_DOMAIN:-amazon.com}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-300}
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
    volumes:
      - shopping-data:/data
    ports:
      - "${SHOPPING_BIND_ADDRESS:-127.0.0.1}:32768:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  shopping-data:
    name: ${SHOPPING_DATA_VOLUME:-shoppinglist-data}