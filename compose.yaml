services:
  shoppinglist:
    container_name: korb
    image: ${SHOPPING_IMAGE:?Set SHOPPING_IMAGE to the published application image}
    restart: unless-stopped
    environment:
      SHOPPING_DATA_DIR: /data
      AMAZON_DOMAIN: ${AMAZON_DOMAIN:-amazon.com}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-300}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
    volumes:
      - shopping-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  tailscale:
    container_name: tailscale-korb
    image: tailscale/tailscale:stable
    hostname: ${TS_HOSTNAME:-liste}
    restart: unless-stopped
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:-liste}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_CERT_DOMAIN: ${TS_CERT_DOMAIN:-liste.drake-aldebaran.ts.net}
    entrypoint: ["/bin/sh", "/config/tailscale-entrypoint.sh"]
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./config/serve.json:/config/serve.json:ro
      - ./config/tailscale-entrypoint.sh:/config/tailscale-entrypoint.sh:ro
    depends_on:
      shoppinglist:
        condition: service_healthy
    secrets:
      - tailscale_authkey

volumes:
  shopping-data:
    name: ${SHOPPING_DATA_VOLUME:-shoppinglist-data}
  tailscale-state:

secrets:
  tailscale_authkey:
    file: ${TS_AUTHKEY_SECRET_FILE:?Set TS_AUTHKEY_SECRET_FILE}