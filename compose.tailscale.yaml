services:
  shoppinglist:
    environment:
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"

  tailscale:
    container_name: tailscale-korb
    image: tailscale/tailscale:stable
    hostname: ${TS_HOSTNAME:-korb}
    restart: unless-stopped
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:-korb}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_CERT_DOMAIN: ${TS_CERT_DOMAIN:?Set TS_CERT_DOMAIN}
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:41234
    entrypoint: ["/bin/sh", "/config/tailscale-entrypoint.sh"]
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./config/serve.json:/config/serve.json:ro
      - ./config/tailscale-entrypoint.sh:/config/tailscale-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      shoppinglist:
        condition: service_healthy
    secrets:
      - tailscale_authkey

volumes:
  tailscale-state:

secrets:
  tailscale_authkey:
    file: ${TS_AUTHKEY_SECRET_FILE:?Set TS_AUTHKEY_SECRET_FILE}